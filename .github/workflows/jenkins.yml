name: Trigger Jenkins

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      ALB_NAME: proj-prod-documind
      JENKINS_JOB_NAME: documind
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::106002846523:role/gha-read-lb
          aws-region: us-east-1
      
      - name: Find Jenkins LB
        id: lb
        run: |
          DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ALB_NAME }}" \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"

      - name: Trigger Jenkins job
        run: |
          # 1. Fetch the Jenkins crumb using the JSON API (with -sSLk and trailing slash)
          CRUMB_JSON=$(curl -sSLk -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "http://${{ steps.lb.outputs.dns }}/jenkins/crumbIssuer/api/json/")
          
          echo "Crumb JSON Response: $CRUMB_JSON"
          
          FIELD=$(echo "$CRUMB_JSON" | jq -r '.crumbRequestField')
          VAL=$(echo "$CRUMB_JSON" | jq -r '.crumb')
          
          # 2. Trigger the build using the extracted header
          curl -fsSLk -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            -H "${FIELD}:${VAL}" \
            "http://${{ steps.lb.outputs.dns }}/jenkins/job/${{ env.JENKINS_JOB_NAME }}/build/"
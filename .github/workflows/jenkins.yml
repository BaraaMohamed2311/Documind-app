name: Trigger Jenkins

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Debug OIDC Token Sub Claim
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Decoded sub claim:"
          echo "$TOKEN" | awk -F'.' '{print $2}' | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '.sub'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::106002846523:role/gha-read-lb
          aws-region: us-east-1
      
      - name: Find Jenkins LB
        id: lb
        run: |
          DNS=$(aws elbv2 describe-load-balancers \
            --names proj-prod-documind \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"

      - name: Trigger Jenkins job
        run: |
          curl -fsS -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "https://${{ steps.lb.outputs.dns }}/job/my-job/build"